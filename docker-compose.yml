# ═══════════════════════════════════════════════════════════════
# Home Automation Stack — Docker Compose
# Services: Frigate, Mosquitto, Home Assistant, Whisper (STT),
#           Google Translate (TTS — cloud, no container)
# Host: woodhull (amd64) — migrated from media (arm64) 2026-08-31.
# HOST_IP / FRIGATE_MEDIA come from .env (gitignored, host-specific —
# see .env.example). The ${HOST_IP:?} guard below is deliberate: it
# stops a stray `docker compose up` on a host with no .env (e.g. the
# old Mac) from re-binding the ports there instead of failing loudly.
# ═══════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────
  # Mosquitto MQTT Broker
  # Lightweight message bus between Frigate ↔ HA
  # Authentication required (password_file)
  # ──────────────────────────────────────────────
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    networks:
      - home-automation
    healthcheck:
      # Just verify the port is accepting connections — avoids auth complexity
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 8m     # trimmed from 16m (2026-04-14) — avg 2m, max 11m; 8m still gives safe headroom
          cpus: "0.5"
        reservations:
          memory: 8m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Frigate NVR — motion detection + recording
  # Web UI: http://192.168.1.71:8971
  # Tailscale: https://woodhull.tail317990.ts.net:8971 (via tailscale serve on host)
  # Publishes camera events to MQTT for Home Assistant
  # Camera credentials loaded from secrets via env vars
  # Detector: OpenVINO on the iGPU (/dev/dri/renderD128) — replaces the
  # Apple Neural Engine ZMQ bridge (FrigateDetector.app) that ran on media.
  # ──────────────────────────────────────────────
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.2   # multi-arch — amd64 verified present 2026-08-31
    restart: unless-stopped
    stop_grace_period: 30s
    # cap_drop: ALL removed — Frigate uses s6-overlay which needs CHOWN/SETUID/SETGID
    # at startup to set up log directories. security_opt still hardens against privesc.
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # iGPU — OpenVINO detector + VAAPI decode
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    # Shared memory — increase if you add more cameras
    shm_size: "512mb"   # 256mb -> 512mb (2026-06-12) — added backyard camera (2nd feed)
    ports:
      - "${HOST_IP:?set HOST_IP in .env}:8971:8971"   # Frigate web UI — direct host port (no proxy)
      - "${HOST_IP:?set HOST_IP in .env}:8554:8554"   # RTSP re-stream (optional)
    volumes:
      # Config directory — frigate.db lives here
      - ./frigate:/config
      # Recordings/snapshots/exports — outside the repo, on the 1TB NVMe (not the USB media SSD)
      - ${FRIGATE_MEDIA:?set FRIGATE_MEDIA in .env}:/media/frigate
      # Tmpfs cache reduces SSD wear (1 GB in RAM)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 536870912   # 512 MB — was 1 GB; sufficient for 1 camera
    env_file:
      - ./secrets/frigate.env  # FRIGATE_RTSP_USER and FRIGATE_RTSP_PASSWORD for config.yml
    environment:
      TZ: America/New_York
    secrets:
      - PLUS_API_KEY
    networks:
      - home-automation
    healthcheck:
      # Hit Frigate's internal HTTP API — avoids the HTTP 400 noise from bare TCP probes on port 8971
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # Frigate takes time to load camera + detectors
    deploy:
      resources:
        limits:
          # 1536m (Mac) -> 2048m (2026-08-31 migration) -> 3072m (2026-09-09).
          # Frigate drifts upward ~70 MiB/day and resets on restart: in the 2.25
          # days after its 09-07 restart it went 84.2% -> 91.3% of the 2048m cap,
          # which projected to hitting the ceiling in ~2.5 more days. anon is the
          # real thing here (1.28 G of 2 G), not page cache — unlike every other
          # container on this host. 3072m turns a ~4-day runway into ~8+ days.
          # It buys time; it does not fix the drift. See home-automation/TODO.md.
          memory: 3072m
          cpus: "2.0"     # reduced from 4.0 — no CPU detection workload
        reservations:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Home Assistant — central hub for all automation
  # Web UI: http://192.168.1.71:8123
  # MQTT credentials: user=homeassistant, pass in secrets/mqtt_password
  # ──────────────────────────────────────────────
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    stop_grace_period: 60s   # give recorder time to write clean shutdown marker before SIGKILL (default 10s was too short)
    # cap_drop: ALL removed — HA uses s6-overlay init system
    # Entrypoint wrapper: runs patch_hacs.sh before /init to reapply the
    # startup-timeout patch if HACS updated itself and overwrote base.py.
    # exec /init ensures s6-overlay remains PID 1. Added 2026-04-30.
    #
    # SSL_CERT_FILE: Python 3.14 (HA 2026.7) uses an incomplete system CA bundle
    # that lacks DigiCert Global Root CA, breaking ssl.create_default_context()
    # for api.wyzecam.com and similar. Exporting SSL_CERT_FILE to certifi's bundle
    # (which has the correct roots) before exec /init fixes this; the env var is
    # inherited by s6-overlay → HA's Python process. Added 2026-07-04.
    entrypoint: ["/bin/bash", "-c", "export SSL_CERT_FILE=$(python3 -c 'import certifi; print(certifi.where())' 2>/dev/null || true); /config/scripts/patch_hacs.sh; exec /init"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    ports:
      - "${HOST_IP:?set HOST_IP in .env}:8123:8123"   # Web UI
      - "${HOST_IP:?set HOST_IP in .env}:6053:6053"   # ESPHome native API (Voice PE connects here)
    volumes:
      - ./homeassistant:/config
    environment:
      TZ: America/New_York
    # dns: removed 2026-07-04 — explicit nameserver relies on host-bridge routing that
    # breaks on container restart. Docker's embedded resolver (127.0.0.11 via iptables)
    # forwards upstream to the host's system DNS instead.
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8123 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # HA takes ~60-90s to fully initialize
    deploy:
      resources:
        limits:
          memory: 896m    # raised from 768m (2026-05-27) — recurring 80%+ peaks; +48 MiB/week trend; preemptive raise
          cpus: "1.5"
        reservations:
          memory: 192m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Whisper — local speech-to-text (Wyoming protocol)
  # Replaces native wyoming-whisperkit (CoreML/ANE, Mac-only — no Linux
  # equivalent). Added 2026-08-31 for the woodhull migration bake-off;
  # see HOME_AUTOMATION_STACK_MIGRATION.md §5.4 for the winning model/settings.
  # Published port is for the Phase-1 bake-off only (the live Mac HA points at
  # it during the trial) — drop the ports block after cutover once HA on
  # woodhull reaches it as whisper:10300 over the compose network.
  # ──────────────────────────────────────────────
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >-
      --model base.en --language en --beam-size 1
      --data-dir /data --download-dir /data
    volumes:
      - /srv/whisper:/data
    environment:
      TZ: America/New_York
    networks:
      - home-automation
    ports:
      - "${HOST_IP:?set HOST_IP in .env}:10300:10300"
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "3.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ──────────────────────────────────────────────
# Shared Docker network — all services can reach
# each other by container name (e.g. "mosquitto")
# ──────────────────────────────────────────────
networks:
  home-automation:
    name: home-automation

# ──────────────────────────────────────────────
# Secrets — API keys and credentials stored outside the compose file
# ──────────────────────────────────────────────
secrets:
  PLUS_API_KEY:
    file: ./secrets/PLUS_API_KEY

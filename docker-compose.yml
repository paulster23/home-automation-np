# ═══════════════════════════════════════════════════════════════
# Home Automation Stack — Docker Compose
# Services: Frigate, Mosquitto, Home Assistant, Music Assistant,
#           Whisper (STT), Google Translate (TTS — cloud, no container)
# ═══════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────
  # Mosquitto MQTT Broker
  # Lightweight message bus between Frigate ↔ HA
  # Authentication required (password_file)
  # ──────────────────────────────────────────────
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    platform: linux/arm64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    networks:
      - home-automation
    healthcheck:
      # Just verify the port is accepting connections — avoids auth complexity
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 8m     # trimmed from 16m (2026-04-14) — avg 2m, max 11m; 8m still gives safe headroom
          cpus: "0.5"
        reservations:
          memory: 8m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Frigate NVR — motion detection + recording
  # Web UI: http://localhost:8971 (HTTP — TLS disabled, served directly)
  # LAN access: http://media.local:8971
  # Tailscale: https://media.tail317990.ts.net:8971 (via tailscale serve on host)
  # Publishes camera events to MQTT for Home Assistant
  # Camera credentials loaded from secrets via env vars
  # ──────────────────────────────────────────────
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.1-standard-arm64
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 30s
    # cap_drop: ALL removed — Frigate uses s6-overlay which needs CHOWN/SETUID/SETGID
    # at startup to set up log directories. security_opt still hardens against privesc.
    security_opt:
      - no-new-privileges:true
    # Required for Apple Silicon detector — allows container to reach
    # FrigateDetector.app running on the macOS host via ZMQ on port 5555
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    # Shared memory — increase if you add more cameras
    shm_size: "512mb"   # 256mb -> 512mb (2026-06-12) — added backyard camera (2nd feed)
    ports:
      - "192.168.1.70:8971:8971"   # Frigate web UI — direct host port (no proxy)
      - "192.168.1.70:8554:8554"   # RTSP re-stream (optional)
    volumes:
      # Config directory — frigate.db lives here
      - ./frigate:/config
      # All recordings and snapshots
      - ./frigate/storage:/media/frigate
      # Tmpfs cache reduces SSD wear (1 GB in RAM)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 536870912   # 512 MB — was 1 GB; sufficient for 1 camera
    env_file:
      - ./secrets/frigate.env  # FRIGATE_RTSP_USER and FRIGATE_RTSP_PASSWORD for config.yml
    environment:
      TZ: America/New_York
    secrets:
      - PLUS_API_KEY
    networks:
      - home-automation
    healthcheck:
      # Hit Frigate's internal HTTP API — avoids the HTTP 400 noise from bare TCP probes on port 8971
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # Frigate takes time to load camera + detectors
    deploy:
      resources:
        limits:
          memory: 1536m   # raised from 1310m (2026-05-27) — post-restart drift +247 MiB/week trend; 1536m gives ~4 weeks runway
          cpus: "2.0"     # reduced from 4.0 — no CPU detection workload
        reservations:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Home Assistant — central hub for all automation
  # Web UI: http://localhost:8123
  # First run: visit UI to create your admin account
  # MQTT credentials: user=homeassistant, pass in secrets/mqtt_password
  # ──────────────────────────────────────────────
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    platform: linux/arm64
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    stop_grace_period: 60s   # give recorder time to write clean shutdown marker before SIGKILL (default 10s was too short)
    # cap_drop: ALL removed — HA uses s6-overlay init system
    # Entrypoint wrapper: runs patch_hacs.sh before /init to reapply the
    # startup-timeout patch if HACS updated itself and overwrote base.py.
    # exec /init ensures s6-overlay remains PID 1. Added 2026-04-30.
    entrypoint: ["/bin/bash", "-c", "/config/scripts/patch_hacs.sh; exec /init"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    ports:
      - "192.168.1.70:8123:8123"   # Web UI
      - "192.168.1.70:6053:6053"   # ESPHome native API (Voice PE connects here)
    volumes:
      - ./homeassistant:/config
    environment:
      TZ: America/New_York
    dns:
      - 1.1.1.1   # Bypass macOS host resolver — intermittent timeouts on api.wyzecam.com + accounts.spotify.com
      - 8.8.8.8   # Google fallback
    dns_opt:      # 2026-06-26: harden c-ares against Docker Desktop DNS-forwarder blips (bursty aiodns timeouts on wyzecam/spotify)
      - timeout:2   # 2s per try instead of c-ares ~5s default
      - attempts:5  # retry up to 5x before surfacing a failure
      - rotate      # spread queries across both servers, don't always hit 1.1.1.1 first
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8123 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # HA takes ~60-90s to fully initialize
    deploy:
      resources:
        limits:
          memory: 896m    # raised from 768m (2026-05-27) — recurring 80%+ peaks; +48 MiB/week trend; preemptive raise
          cpus: "1.5"
        reservations:
          memory: 192m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Music Assistant — Spotify, radio, media playback
  # Web UI: http://localhost:8095
  # music-assistant removed 2026-05-03 — was radio-only (RadioBrowser/TuneIn) after
  # Spotify removed 2026-03-28. Radio now uses direct MP3 streams; Spotify via
  # librespot → ESPHome direct path. MA was consuming ~460m RAM doing nothing.
  # To restore: git show HEAD~1:home-automation/docker-compose.yml | grep -A40 'music-assistant:'

  # ──────────────────────────────────────────────
  # Whisper — general-purpose local speech-to-text
  # Uses OpenAI's Whisper model (tiny.en) to transcribe
  # whisper container removed 2026-04-22 — inactive since 2026-03-15.
  # STT is handled by native wyoming-whisperkit (LaunchAgent, port 7892).
  # Fallback is wyoming-mlx-whisper (LaunchAgent, port 7891).
  # To restore Docker whisper if both native backends fail:
  #   git show HEAD~1:home-automation/docker-compose.yml | grep -A40 'whisper:'
  #   docker compose --profile stt up -d whisper

# ──────────────────────────────────────────────
# Shared Docker network — all services can reach
# each other by container name (e.g. "mosquitto")
# ──────────────────────────────────────────────
networks:
  home-automation:
    name: home-automation

# ──────────────────────────────────────────────
# Named volumes for voice models (downloaded on first run)
# ──────────────────────────────────────────────
# volumes block removed — whisper-data volume removed 2026-04-22 with whisper service.
# Run `docker volume rm home-automation_whisper-data` to reclaim disk space if not already done.

# ──────────────────────────────────────────────
# Secrets — API keys and credentials stored outside the compose file
# ──────────────────────────────────────────────
secrets:
  PLUS_API_KEY:
    file: ./secrets/PLUS_API_KEY

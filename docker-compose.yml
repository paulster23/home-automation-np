# ═══════════════════════════════════════════════════════════════
# Home Automation Stack — Docker Compose
# Services: Frigate, Mosquitto, Home Assistant, Music Assistant,
#           Whisper (STT), Google Translate (TTS — cloud, no container)
# ═══════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────
  # Mosquitto MQTT Broker
  # Lightweight message bus between Frigate ↔ HA
  # Authentication required (password_file)
  # ──────────────────────────────────────────────
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    platform: linux/arm64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    networks:
      - home-automation
    healthcheck:
      # Just verify the port is accepting connections — avoids auth complexity
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.5"
        reservations:
          memory: 16m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Frigate NVR — motion detection + recording
  # Web UI: https://localhost:8971
  # Publishes camera events to MQTT for Home Assistant
  # Camera credentials loaded from secrets via env vars
  # ──────────────────────────────────────────────
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.0-standard-arm64
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 30s
    # cap_drop: ALL removed — Frigate uses s6-overlay which needs CHOWN/SETUID/SETGID
    # at startup to set up log directories. security_opt still hardens against privesc.
    security_opt:
      - no-new-privileges:true
    # Required for Apple Silicon detector — allows container to reach
    # FrigateDetector.app running on the macOS host via ZMQ on port 5555
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    # Shared memory — increase if you add more cameras
    shm_size: "256mb"
    ports:
      - "8971:8971"   # Web UI (HTTPS)
      - "8554:8554"   # RTSP re-stream (optional)
    volumes:
      # Config directory — frigate.db lives here
      - ./frigate:/config
      # All recordings and snapshots
      - ./frigate/storage:/media/frigate
      # SSL Certificate (mkcert)
      - ./certs:/etc/letsencrypt/live/frigate:ro
      # Tmpfs cache reduces SSD wear (1 GB in RAM)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 536870912   # 512 MB — was 1 GB; sufficient for 1 camera
    env_file:
      - ./secrets/frigate.env  # FRIGATE_RTSP_USER and FRIGATE_RTSP_PASSWORD for config.yml
    environment:
      TZ: America/New_York
    secrets:
      - PLUS_API_KEY
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8971 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # Frigate takes time to load camera + detectors
    deploy:
      resources:
        limits:
          memory: 1024m   # reduced from 1536m — detection offloaded to Neural Engine via ZMQ
          cpus: "2.0"     # reduced from 4.0 — no CPU detection workload
        reservations:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Home Assistant — central hub for all automation
  # Web UI: http://localhost:8123
  # First run: visit UI to create your admin account
  # MQTT credentials: user=homeassistant, pass in secrets/mqtt_password
  # ──────────────────────────────────────────────
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    platform: linux/arm64
    restart: unless-stopped
    # cap_drop: ALL removed — HA uses s6-overlay init system
    security_opt:
      - no-new-privileges:true
    depends_on:
      mosquitto:
        condition: service_started  # Start after mosquitto, don't block on health
    ports:
      - "8123:8123"   # Web UI
      - "6053:6053"   # ESPHome native API (Voice PE connects here)
    volumes:
      - ./homeassistant:/config
    environment:
      TZ: America/New_York
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8123 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # HA takes ~60-90s to fully initialize
    deploy:
      resources:
        limits:
          memory: 768m    # HA + HACS + integrations typically 300-500 MB; was 1g
          cpus: "1.5"
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────
  # Music Assistant — Spotify, radio, media playback
  # Web UI: http://localhost:8095
  # Connects to HA as an integration for voice control
  # Spotify provider handles search/playback via API.
  # Spotify Connect (mDNS) not possible on macOS Docker Desktop.
  # NOTE: MASS_BASE_URL uses a static IP (192.168.1.70).
  # If the Mac Mini's IP changes, update this + music-assistant/settings.json
  # ──────────────────────────────────────────────
  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:latest
    platform: linux/arm64
    restart: unless-stopped
    # cap_drop: ALL removed — Music Assistant uses s6-overlay init system
    security_opt:
      - no-new-privileges:true
    ports:
      - "8095:8095"   # Web UI
      - "8097:8097"   # Stream server (audio delivery to players)
    networks:
      - home-automation
    volumes:
      - ./music-assistant:/data
    environment:
      TZ: America/New_York
      MASS_BASE_URL: http://192.168.1.70:8095
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8095 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s  # MA takes ~2 min to register players + providers
    deploy:
      resources:
        limits:
          memory: 512m    # Audio streaming; was 768m
          cpus: "1.5"
        reservations:
          memory: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Whisper — general-purpose local speech-to-text
  # Uses OpenAI's Whisper model (tiny.en) to transcribe
  # arbitrary speech — including open-ended commands like
  # "play the breeders" that Speech-to-Phrase can't handle.
  # tiny.en: ~150MB RAM, fast on M1, English-only.
  # Port is internal-only — HA connects via Docker network
  # using container name "whisper" (verified in core.config_entries)
  # ──────────────────────────────────────────────
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    platform: linux/arm64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "10300"       # Internal only — HA uses whisper:10300 via Docker network
    volumes:
      - whisper-data:/data
    environment:
      TZ: America/New_York
    command: --model tiny.en --language en --compute-type int8
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10300 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m    # tiny.en peaks ~400-500 MB during transcription on ARM64
          cpus: "2.0"     # bumped from 1.0 — Whisper STT was taking 15-17s per transcription
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ──────────────────────────────────────────────
# Shared Docker network — all services can reach
# each other by container name (e.g. "mosquitto")
# ──────────────────────────────────────────────
networks:
  home-automation:
    name: home-automation

# ──────────────────────────────────────────────
# Named volumes for voice models (downloaded on first run)
# ──────────────────────────────────────────────
volumes:
  whisper-data:

# ──────────────────────────────────────────────
# Secrets — API keys and credentials stored outside the compose file
# ──────────────────────────────────────────────
secrets:
  PLUS_API_KEY:
    file: ./secrets/PLUS_API_KEY

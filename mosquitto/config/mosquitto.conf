# ─────────────────────────────────────────────────────────────
# Mosquitto MQTT Broker — Home Automation Stack
# Authentication REQUIRED — credentials in password_file
# ─────────────────────────────────────────────────────────────

# Listen on the standard MQTT port
listener 1883

# Require username/password authentication
allow_anonymous false
password_file /mosquitto/config/password_file

# Don't persist messages to disk (all our services reconnect cleanly)
persistence false

# Log to stdout so Docker can capture it
log_dest stdout
log_type warning
log_type error

# ─────────────────────────────────────────────────────────────
# Mosquitto MQTT Broker — Home Automation Stack
# No authentication — safe because this broker is only
# reachable on the internal Docker network (not exposed to host)
# ─────────────────────────────────────────────────────────────

# Listen on the standard MQTT port
listener 1883

# Allow connections without username/password
allow_anonymous true

# Don't persist messages to disk (all our services reconnect cleanly)
persistence false

# Log to stdout so Docker can capture it
log_dest stdout
log_type warning
log_type error

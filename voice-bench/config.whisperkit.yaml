# voice-bench config for wyoming-whisperkit A/B benchmarking.
# To activate:
#   cp config.whisperkit.yaml config.yaml
#   launchctl stop com.voice-bench 2>/dev/null; launchctl start com.voice-bench
# (or just restart the voice-bench process however you normally do it)

# ── Home Assistant connection ─────────────────────────────────────────────
ha_websocket_url: "ws://192.168.1.70:8123/api/websocket"
ha_token_file: "./secrets/ha_token"

# ── Entities to watch ─────────────────────────────────────────────────────
satellite_entity: "assist_satellite.home_assistant_voice_0a3a76_assist_satellite"
amp_entity:       "media_player.home_assistant_voice_0a3a76_media_player"
music_entity:     "media_player.naboo_media_player"

# ── WhisperKit log path (whisperkit-bridge writes timing to stderr) ───────
# wyoming-whisperkit logs to log/whisper.log (stdout) + log/whisper.err (stderr)
# The timing lines come from wyoming_whisperkit's _LOGGER.info(text) call,
# which mirrors wyoming-mlx-whisper's pattern exactly.
whisper_log:   "/Users/media/containers/home-automation/wyoming-whisperkit/log/whisper.err"
whisper_plist: "/Users/media/Library/LaunchAgents/com.wyoming.whisperkit.plist"
whisper_model: "whisperkit-small"

# ── Stream health monitoring ──────────────────────────────────────────────
librespot_stream_log: "/Users/media/containers/home-automation/librespot/log/stream.log"
radio_active_entity:  "input_boolean.radio_active"
dropout_window_secs:  30

# ── Dashboard ─────────────────────────────────────────────────────────────
port: 7700

# ── Config tag ────────────────────────────────────────────────────────────
tag: "whisperkit-small-silero-vad"
notes: "WhisperKit small (CoreML/ANE), Silero-VAD early trigger (450ms silence), benchmarked 0.85s avg"

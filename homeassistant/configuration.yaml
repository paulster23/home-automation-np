# ═══════════════════════════════════════════════════════════════
# New Paltz — Home Assistant site configuration
#
# This is the TRACKED source of truth for NP. configuration.yaml is a
# copy of it and is deliberately divergent from Brooklyn's — the same
# pattern frigate/config.np.yml uses, for the same reason: one file
# cannot describe two houses, and the live copy must never be committed
# over the other site's.
#
# Deliberately NOT carried over from Brooklyn:
#   spotify_voice_assistant / intent_script  — BK voice stack
#   shell_command.playball                   — points at 192.168.1.70
#   input_boolean voice helpers, timer       — BK voice pipeline
#   custom_components (windmillac, HACS)     — no HACS at NP
#   frontend.themes                          — no themes dir here
#
# No http: block. HA 2026.7+ migrates http: config into .storage/http on
# first boot and IGNORES YAML on every boot after, and leaving the block
# present also raises a Repair issue. See TROUBLESHOOTING.md 2026-09-03
# for the 400 Bad Request incident this caused at Brooklyn.
# ═══════════════════════════════════════════════════════════════

# Brings in frontend, history, logbook, mobile_app, zeroconf, ssdp,
# dhcp discovery, backup, and the rest of the standard set.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

conversation:

logger:
  default: info

# ── Database housekeeping ─────────────────────────────────────
# 14 days rather than Brooklyn's 30. This instance tracks a handful of
# climate entities and one camera, and it lives on the M1's 460 GB boot
# disk inside a 4.1 GB Docker VM — keep the DB small on purpose.
recorder:
  purge_keep_days: 14
  commit_interval: 1

# ── Paging ────────────────────────────────────────────────────────
# ntfy lives on woodhull in BROOKLYN. Verified 2026-09-14 from inside
# this container: 192.168.1.71:8111 answers in ~56 ms — but woodhull's
# TAILNET address (100.103.72.117) does NOT resolve/connect from in here
# at all. The container can only use the LAN address, and that works
# solely because the Mac runs Tailscale with RouteAll: true.
#
# ⛔ `tailscale set --accept-routes=false` on this Mac SILENTLY kills New
#    Paltz's ability to page. That is Site Magic step 4 — do not run it
#    until a gateway tunnel is proven. See plans/ + project memory.
#
# Consequence to design around: if the INTER-SITE link is down, the page
# does not arrive. So every automation below acts on the hardware FIRST
# and notifies SECOND — a failed notify must never block the heat.
rest_command:
  ntfy:
    url: "http://192.168.1.71:8111/homelab"
    method: POST
    content_type: "text/plain; charset=utf-8"
    payload: "{{ message }}"
    timeout: 10
    headers:
      Title: "{{ title }}"
      Priority: "{{ priority | default('default') }}"
      Tags: "{{ tags | default('house') }}"

  # ── Liveness heartbeat → Uptime Kuma on woodhull ──────────────────
  # Kuma monitor 36 "NP · Home Assistant · heartbeat" (push type, token below).
  # WHY: Kuma monitor 35 pings the Mac. The Mac can be up and answering
  # while THIS container is dead and freeze protection is silently gone.
  # A host ping cannot tell those apart; a push from inside HA can.
  # Same LAN path as rest_command.ntfy above, and load-bearing for the
  # same reason — see the RouteAll warning there.
  # Cadence: automation np_kuma_heartbeat every 5 min + on HA start.
  # Kuma: interval 300, retry 300, maxretries 1 → DOWN after ~10 min of
  # silence, then ntfy. Push tokens are not secrets in the credential
  # sense (write-only, one monitor), so this one stays inline.
  kuma_heartbeat:
    url: >-
      http://192.168.1.71:3001/api/push/Xs7BkAZ7Mv?status=up&msg={{ msg | default('ok') | urlencode }}&ping=
    method: GET
    timeout: 10

# ── Frigate (NP) porch camera over MQTT ───────────────────────────
# No HACS at NP, so the Frigate camera is surfaced with native MQTT
# entities rather than the Frigate integration. Topic prefix is
# `frigate_np` (frigate/config.yml mqtt.topic_prefix); availability is
# frigate_np/available. These are cheap (no extra video decode) — a live
# camera decode is deliberately NOT added, the M1's 4.1 GB VM is tight.
# Added 2026-09-18 when the porch cam (Reolink RLC-510WA, static .34)
# went live. See home-automation/CONTEXT.md + frigate/config.yml.
mqtt:
  binary_sensor:
    - name: "Porch Motion"
      unique_id: np_porch_motion
      state_topic: "frigate_np/porch/motion/state"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: motion
      availability_topic: "frigate_np/available"
      payload_available: "online"
      payload_not_available: "offline"
      device: &porch_dev
        identifiers: ["np_frigate_porch"]
        name: "Porch Camera (Frigate)"
        manufacturer: "Reolink"
        model: "RLC-510WA"
    - name: "Porch Person Occupancy"
      unique_id: np_porch_person_occupancy
      state_topic: "frigate_np/porch/person"
      value_template: "{{ 'ON' if (value | int(0)) > 0 else 'OFF' }}"
      device_class: occupancy
      availability_topic: "frigate_np/available"
      payload_available: "online"
      payload_not_available: "offline"
      device: *porch_dev
  sensor:
    - name: "Porch Person Count"
      unique_id: np_porch_person_count
      state_topic: "frigate_np/porch/person"
      value_template: "{{ value | int(0) }}"
      availability_topic: "frigate_np/available"
      payload_available: "online"
      payload_not_available: "offline"
      device: *porch_dev
  camera:
    - name: "Porch Last Person"
      unique_id: np_porch_last_person
      topic: "frigate_np/porch/person/snapshot"
      device: *porch_dev

# ── Occupancy flag (New Paltz) ────────────────────────────────────
# The gate on camera paging. OFF means the house is empty and a person on
# the porch camera is worth waking Paul for; ON means someone is there and
# it is not.
#
# Deliberately a manual flag, not a device_tracker. NP Home Assistant is
# only reachable on the LAN or over the tailnet, and the phone is off the
# tailnet most of the time (iphone173: "last seen 2 days ago" on 2026-09-20),
# so presence detection through the companion app would be wrong exactly
# when it mattered. At the house the flag is one tap in the HA app on the
# local network. Automation `np_occupied_stuck` covers the failure mode
# that actually bites: leaving it ON, which silently disables paging.
#
# State is RESTORED across restarts rather than forced. Forcing it off
# would be fail-safe, but it would also page Paul about himself after every
# HA restart while he is in the house, and an alert that cries wolf stops
# being read.
input_boolean:
  np_occupied:
    name: "NP occupied"
    icon: mdi:home-account

# ── Camera paging (New Paltz) ─────────────────────────────────────
# See homeassistant/scripts/np_porch_page.py for why this is a script and
# not a rest_command: the page carries the snapshot as an ntfy attachment,
# and every send that fails (NP's WAN drops most nights) is queued and
# retried rather than lost.
shell_command:
  np_porch_page: "python3 /config/scripts/np_porch_page.py {{ event_id }}"
  np_porch_flush: "python3 /config/scripts/np_porch_page.py --flush"

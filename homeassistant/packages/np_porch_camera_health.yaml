# ═══════════════════════════════════════════════════════════════
# np_porch_camera_health.yaml — is the porch camera actually streaming?
#
# Added 2026-09-30 after the porch cam dropped off Wi-Fi at 16:45 ET and
# nothing paged (TROUBLESHOOTING 2026-09-30). Paul is off-site and wants to
# know when it comes back.
#
# Signal: Frigate's own stats on MQTT (frigate_np/stats, every 60 s by
# default). cameras.porch.camera_fps > 0 means frames are arriving from the
# camera. This is the end-to-end truth: it catches a dead camera, a dead
# Wi-Fi link AND a wedged ffmpeg, which a UniFi client tracker or a ping
# would not. If Frigate itself stops publishing, the sensor simply holds its
# last state; Frigate-down is already covered by Kuma.
#
# Startup safety: after a restart or reload the sensor is `unknown` until the
# first stats message. Both automations require a real on<->off transition
# (from: "on" / from: "off"), so a reload never fires either alert.
#
# Paging path (2026-10-06): shell_command.np_notify — woodhull + ntfy.sh mirror
# + retry queue, so a Brooklyn outage does not drop these pages.
# ═══════════════════════════════════════════════════════════════

template:
  - triggers:
      - trigger: mqtt
        topic: "frigate_np/stats"
    binary_sensor:
      - name: "NP Porch Camera Streaming"
        unique_id: np_porch_camera_streaming
        device_class: connectivity
        state: >-
          {% set cams = trigger.payload_json.get('cameras', {}) if trigger.payload_json is mapping else {} %}
          {{ (cams.get('porch', {}).get('camera_fps', 0) | float(0)) > 0 }}
        attributes:
          camera_fps: >-
            {% set cams = trigger.payload_json.get('cameras', {}) if trigger.payload_json is mapping else {} %}
            {{ cams.get('porch', {}).get('camera_fps', 0) | float(0) }}

automation:
  - id: np_porch_camera_back_online
    alias: "NP · Porch camera back online (page)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.np_porch_camera_streaming
        from: "off"
        to: "on"
    variables:
      down_min: >-
        {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int }}
    # 2026-10-05: only page "back" if the 10-min "offline" page also went out.
    # Without this, every 60 s stats sample at 0 fps produced a "back online,
    # down about 1 min" page with no matching offline page.
    conditions:
      - condition: template
        value_template: "{{ (now() - trigger.from_state.last_changed).total_seconds() >= 600 }}"
    actions:
      - action: shell_command.np_notify
        continue_on_error: true
        data:
          title: "NP porch camera back online"
          message: >-
            Frames flowing again ({{ state_attr('binary_sensor.np_porch_camera_streaming', 'camera_fps') }} fps).
            It was down about {{ down_min }} min.
          priority: 4
          tags: ["white_check_mark", "camera"]

  - id: np_porch_camera_offline
    alias: "NP · Porch camera offline 10 min (page)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.np_porch_camera_streaming
        from: "on"
        to: "off"
        for: "00:10:00"
    actions:
      - action: shell_command.np_notify
        continue_on_error: true
        data:
          title: "NP porch camera offline"
          message: >-
            No frames from the porch camera for 10 min. Usually power at the
            porch (outlet, switch, GFCI, adapter). Frigate is still running.
          priority: 4
          tags: ["warning", "camera"]

# ═══════════════════════════════════════════════════════════════
# np_heading.yaml — "Heading to NP" (2026-10-05)
#
# The iPhone decides WHEN: a Shortcuts personal automation ("Arrive" at a
# ~40 mi circle round NP) POSTs to the webhook below over Tailscale
# (https://brookside.tail317990.ts.net:18123). Since 2026-10-11 it runs
# IMMEDIATELY (no confirmation): the prompt never surfaced while driving.
# Opt-out instead: an np-info ntfy note with a "Not going" button that POSTs
# to np_heading_cancel_webhook_id.
#
#   webhook   → script.np_arrive (heat 68 °F, fan high, swing both)
#             → timer.np_heading_window (90 min) when the house is empty
#   arrival   (binary_sensor.np_occupied → on) cancels the timer
#   timer ran out with the house still empty → splits OFF + ntfy
#
# The 90-min no-show guard exists ONLY for webhook runs. Running
# script.np_arrive by hand never starts the timer.
#
# local_only: false is required — HA sees the phone's tailnet address
# (100.64/10) via tailscale serve + X-Forwarded-For, and HA does not count
# 100.64/10 as local. The endpoint is still tailnet-only; the webhook id
# (secrets.yaml: np_heading_webhook_id) is the shared secret.
#
# Adding units: extend `units` in script.np_arrive AND the list in
# np_heading_no_show below (grep "climate.np_").
# ═══════════════════════════════════════════════════════════════

timer:
  np_heading_window:
    name: "NP heading-up window"
    duration: "01:30:00"
    restore: true          # a restart mid-window resumes it; if it expired
    icon: mdi:car-clock    # while HA was down, timer.finished fires at startup

automation:
  - id: np_heading_webhook
    alias: "NP · Heading to NP (iPhone Shortcut)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: webhook
        webhook_id: !secret np_heading_webhook_id
        allowed_methods: [POST]
        local_only: false
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.np_occupied
            state: "off"
        then:
          - action: timer.start
            target:
              entity_id: timer.np_heading_window
      - action: script.turn_on
        target:
          entity_id: script.np_arrive
      # 2026-10-11: the iPhone automation now runs WITHOUT confirmation (the
      # prompt never reached Paul while driving with Waze/CarPlay, 10-09), so
      # this note is the opt-OUT: one tap on the ntfy button cancels.
      # np-info is not mirrored to ntfy.sh, so the cancel URL stays private.
      - if:
          - condition: state
            entity_id: timer.np_heading_window
            state: "active"
        then:
          - action: shell_command.np_notify
            continue_on_error: true
            data:
              title: "Heading to NP — pre-heating"
              priority: "default"
              tags: "car,fire"
              topic: !secret ntfy_topic_info
              message: >-
                Living room + kitchen splits heating to 68 °F. They turn off by
                themselves if nobody arrives within 90 min. Not going? Tap below.
              actions:
                - action: http
                  label: "Not going — turn off"
                  url: !secret np_heading_cancel_url
                  method: POST
                  clear: true

  - id: np_heading_cancel
    alias: "NP · Heading to NP — cancelled from the ntfy button"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: webhook
        webhook_id: !secret np_heading_cancel_webhook_id
        allowed_methods: [POST]
        local_only: false
    actions:
      - if:
          - condition: state
            entity_id: timer.np_heading_window
            state: ["active", "paused"]
        then:
          # Stop np_arrive FIRST: inside its 60 s readback it would otherwise see
          # the units off and resend heat (happened in testing 2026-10-11 18:12).
          - action: script.turn_off
            target:
              entity_id:
                - script.np_arrive
                - script.np_climate_apply
          - action: timer.cancel
            target:
              entity_id: timer.np_heading_window
          - delay: 2
          - action: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id:
                - climate.np_living
                - climate.np_kitchen
            data:
              hvac_mode: "off"
          - action: shell_command.np_notify
            continue_on_error: true
            data:
              title: "NP pre-heat cancelled"
              priority: "low"
              tags: "house,zzz"
              topic: !secret ntfy_topic_info
              message: "Splits turned off. Freeze protection still applies."
        else:
          - action: shell_command.np_notify
            continue_on_error: true
            data:
              title: "NP cancel ignored"
              priority: "low"
              tags: "house"
              topic: !secret ntfy_topic_info
              message: >-
                No pre-heat window is running (already arrived, already
                expired, or someone is home), so nothing was changed.

  - id: np_heading_arrived
    alias: "NP · Heading to NP — arrived, cancel no-show guard"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.np_occupied
        to: "on"
    conditions:
      - condition: state
        entity_id: timer.np_heading_window
        state: ["active", "paused"]
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.np_heading_window

  - id: np_heading_no_show
    alias: "NP · Heading to NP — no arrival in 90 min, splits off"
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.np_heading_window
    conditions:
      - condition: state
        entity_id: binary_sensor.np_occupied
        state: "off"
    actions:
      - action: climate.set_hvac_mode
        continue_on_error: true
        target:
          entity_id:
            - climate.np_living
            - climate.np_kitchen
        data:
          hvac_mode: "off"
      - action: shell_command.np_notify
        continue_on_error: true
        data:
          title: "NP splits off — no arrival"
          priority: "default"
          tags: "house,zzz"
          message: >-
            Nobody arrived at New Paltz within 90 minutes of "Heading to NP",
            so the splits were turned off. Freeze protection still applies.

# ═══════════════════════════════════════════════════════════════
# np_heat_cable.yaml — heat cable on the water entry
# (wall entry → pump → pump-outlet valve → main valve → filter).
#
# Added 2026-10-20 (Paul). Plan: project doc claude/NP_WINTER_FREEZE_PLAN.md.
#
# Hardware: plug-in pipe heat cable WITH ITS OWN THERMOSTAT (EasyHeat AHB
# class), on Third Reality plug 0xffffb40e06092796, renamed np_plug_heat_cable
# → switch.np_plug_heat_cable / sensor.np_plug_heat_cable_power.
#
# Design: the cable's thermostat does the switching. The plug stays ON all
# winter, so the cable keeps working with HA, Zigbee or the WAN dead
# (hardware first). HA's jobs:
#   1. np_freeze_protection turns the plug on as its first action.
#   2. np_heat_cable_not_heating — pipes near freezing but the cable draws
#      ~nothing → force on, re-read, page.
#   3. np_heat_cable_watchdog — in season, plug off → turn back on + FYI;
#      plug unreachable → high page.
# The cable draws 0 W most of the time (its thermostat is open above ~freezing),
# so "0 W" alone is normal and is never paged on by itself.
#
# Season gate Nov 1 – Apr 15 on the watchdog only, so it stays quiet while the
# plug is unplugged in summer. The not-heating check needs no gate: it only
# runs when the pipes are actually cold.
#
# Threshold 35 °F on the air sensor at the wall entry is a first guess at
# where the cable thermostat should have closed. Tune after the first cold
# night using sensor.np_plug_heat_cable_power history.
# ═══════════════════════════════════════════════════════════════

automation:
  - id: np_heat_cable_not_heating
    alias: "NP · Heat cable not heating"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.np_temp_basement_pipes_temperature
        below: 35
        for: "00:20:00"
      # numeric_state fires only on the crossing; this re-checks hourly while
      # it stays cold, so a cable that dies mid-cold-spell still pages.
      - trigger: time_pattern
        minutes: 7
    conditions:
      - condition: numeric_state
        entity_id: sensor.np_temp_basement_pipes_temperature
        below: 35
      - condition: template
        value_template: "{{ states('sensor.np_plug_heat_cable_power') | float(0) < 20 }}"
    actions:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.np_plug_heat_cable
      - delay: "00:02:00"
      # Recovered after the turn_on (plug had been off) → no page; the
      # watchdog reports the plug having been off.
      - condition: template
        value_template: "{{ states('sensor.np_plug_heat_cable_power') | float(0) < 20 }}"
      - action: shell_command.np_notify
        continue_on_error: true
        data:
          title: "NP heat cable NOT heating"
          priority: "high"
          tags: "warning,snowflake"
          message: >-
            Basement pipes {{ states('sensor.np_temp_basement_pipes_temperature') }} °F
            but the heat cable draws {{ states('sensor.np_plug_heat_cable_power') }} W
            (plug {{ states('switch.np_plug_heat_cable') }}). Cable, its thermostat
            or the GFCI has failed. Freeze protection on the splits is separate.

  - id: np_heat_cable_watchdog
    alias: "NP · Heat cable plug off or offline"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: 37
    conditions:
      - condition: template
        value_template: >-
          {{ now().month in [11, 12, 1, 2, 3] or (now().month == 4 and now().day <= 15) }}
      - condition: template
        value_template: "{{ states('switch.np_plug_heat_cable') != 'on' }}"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.np_plug_heat_cable
                state: "off"
            sequence:
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: switch.np_plug_heat_cable
              - delay: "00:00:30"
              - action: shell_command.np_notify
                continue_on_error: true
                data:
                  title: "NP heat cable plug was off"
                  priority: "default"
                  tags: "electric_plug"
                  message: >-
                    switch.np_plug_heat_cable was off in winter; HA turned it on
                    (now {{ states('switch.np_plug_heat_cable') }}). It should stay
                    on Nov–mid-Apr; the cable's own thermostat does the switching.
        default:
          - action: shell_command.np_notify
            continue_on_error: true
            data:
              title: "NP heat cable plug offline"
              priority: "high"
              tags: "warning,electric_plug"
              message: >-
                switch.np_plug_heat_cable is {{ states('switch.np_plug_heat_cable') }}.
                HA cannot see or control the pipe heat cable. Check it is plugged in
                (the cable itself still works if the plug has power and is on).

# New Paltz automations.
#
# ⚠️ The climate entities below DO NOT EXIST YET. They appear when the Serin
# CN105 dongles are flashed and adopted (reserved .81 / .82). Until then these
# automations load cleanly and simply never trigger — that is intentional, so
# the logic is written and reviewed in Brooklyn rather than on a ladder.
#
# Adding units 3-5 later: extend the entity_id lists in BOTH automations and
# both scripts. There are four lists; a grep for "climate.np_" finds them all.

- id: np_freeze_protection
  alias: "NP · Freeze protection"
  description: >-
    Any head unit reporting under 45 °F for 5 minutes puts every unit into heat
    at 55 °F, then pages. This is the one automation that must survive a WAN
    outage: the climate calls are local (ESPHome native API over the LAN) and
    run before the notify, so an unreachable ntfy cannot stop the heat.
    The 5-minute debounce rejects a single bad reading; a spurious trigger only
    turns the heat on, which is harmless, while a missed one is not.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id:
        - climate.np_living
        - climate.np_br_down_1
      attribute: current_temperature
      below: 45
      for: "00:05:00"
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: &np_all_units
          - climate.np_living
          - climate.np_br_down_1
      data:
        hvac_mode: heat
    - action: climate.set_temperature
      target:
        entity_id: *np_all_units
      data:
        temperature: 55
    - action: rest_command.ntfy
      data:
        title: "NP FREEZE RISK"
        priority: "urgent"
        tags: "rotating_light,snowflake"
        message: >-
          {{ trigger.to_state.name }} read
          {{ trigger.to_state.attributes.current_temperature }}°F.
          All New Paltz units forced to heat 55°F.

- id: np_climate_unavailable
  alias: "NP · Climate entity unavailable"
  description: >-
    A dongle that drops off Wi-Fi stops reporting temperature, which would make
    freeze protection silently blind — the trigger above can never fire on an
    entity that is 'unavailable'. This is the watchdog for that blind spot.
    30 minutes tolerates a reboot or a brief AP blip.
  mode: single
  triggers:
    - trigger: state
      entity_id:
        - climate.np_living
        - climate.np_br_down_1
      to: "unavailable"
      for: "00:30:00"
  actions:
    - action: rest_command.ntfy
      data:
        title: "NP HVAC sensor offline"
        priority: "high"
        tags: "warning"
        message: >-
          {{ trigger.to_state.name }} has been unavailable for 30 min.
          Freeze protection cannot see this unit.

- id: np_kuma_heartbeat
  alias: "NP · Kuma heartbeat"
  description: >-
    Pushes to Uptime Kuma monitor 36 every 5 minutes so Brooklyn can tell a
    dead Home Assistant from a merely-quiet one. Kuma monitor 35 pings the
    Mac; it stays green while this container is stopped, crash-looping, or
    wedged — which is exactly when freeze protection is not running.
    Unconditional on purpose: it reports that HA is ALIVE, never whether HA
    is HAPPY. Gating it on the state of another automation would turn one
    alert into two meanings. The message body carries the freeze-protection
    state and the count of responding climate entities for context only.
    Also fires on HA start so the monitor recovers within seconds of a
    restart instead of waiting out the 5-minute cycle.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  actions:
    - action: rest_command.kuma_heartbeat
      data:
        msg: >-
          freeze={{ states('automation.np_freeze_protection') }}
          units={{ states.climate | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count }}

# ── Camera paging ─────────────────────────────────────────────────
# Added 2026-09-20. The porch camera has been recording alerts since 09-18
# but nothing turned one into a page, so the camera was recording for
# nobody.

- id: np_porch_person_page
  alias: "NP · Porch person page (house empty)"
  description: >-
    Pages on every person the porch camera sees while `input_boolean.np_occupied`
    is off. Deliberately triggered on Frigate's raw event stream rather than on
    its `alert` severity: alerts require a zone, and on 2026-09-20 two real
    people were tracked in frame but inside neither zone, which Frigate scores
    as a mere `detection`. For an empty house "in frame at all" is the bar Paul
    asked for, so the zone only shapes the wording, never whether it pages.
    Fires on type `new` rather than `end` -- the snapshot is poorer but it
    arrives while the person is still there, which is the entire point.
    mode queued so two people arriving together produce two pages, not one.
  mode: queued
  max: 10
  max_exceeded: silent
  triggers:
    - trigger: mqtt
      topic: "frigate_np/events"
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.payload_json.type == 'new'
           and trigger.payload_json.after.camera == 'porch'
           and trigger.payload_json.after.label == 'person' }}
    - condition: state
      entity_id: input_boolean.np_occupied
      state: "off"
  actions:
    - action: shell_command.np_porch_page
      data:
        event_id: "{{ trigger.payload_json.after.id }}"

- id: np_porch_alert_flush
  alias: "NP · Re-send porch pages missed during a WAN outage"
  description: >-
    ntfy lives on woodhull in Brooklyn. When New Paltz's WAN is down the house
    cannot page and cannot report that it cannot page -- 12x FAILED-BOTH on
    2026-09-17, primary and ntfy.sh fallback crossing the same dead link. The
    events themselves are recorded locally, so only the notification is lost.
    This drains the queue the page script writes on every failure. Also runs on
    HA start, because a restart is one of the ways a page gets dropped.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  actions:
    - action: shell_command.np_porch_flush

- id: np_occupied_stuck
  alias: "NP · Occupancy flag left on"
  description: >-
    `np_occupied` left ON means camera paging is silently disabled. That is the
    same shape of failure as BK_HA=0 sitting in the backup plist for three
    weeks: a flag that was right once, never flipped back, and quiet about it.
    36 hours is longer than any normal stay-and-leave, short enough to catch a
    drive home with the flag still set.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: input_boolean.np_occupied
      to: "on"
      for: "36:00:00"
  actions:
    - action: rest_command.ntfy
      data:
        title: "NP camera paging is off"
        priority: "default"
        tags: "eyes"
        message: >-
          The New Paltz occupancy flag has been ON for 36 hours, so person
          alerts from the porch camera are suppressed. Turn it off if you have
          left the house.

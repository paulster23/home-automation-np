# ═══════════════════════════════════════════════════════════════
# brookside — New Paltz on LINUX (amd64, Intel iGPU)
#
# Activate on brookside BEFORE the first `docker compose up`:
#     cd ~/containers/home-automation
#     cp frigate/config.brookside.yml frigate/config.yml
#
# Same idiom as overrides/np.yml's move-day copy step. brookside uses the
# BASE docker-compose.yml with NO docker-compose.override.yml symlink —
# the base file is already the Linux shape (amd64 image, /dev/dri
# passthrough). overrides/np.yml is the M1's un-migration and must NOT be
# linked here.
#
# Derived from config.yml (the M1's NP config) 2026-10-01, changing only
# what the architecture forces:
#   - detectors: ZMQ apple-silicon -> OpenVINO on the iGPU
#   - model:     yolo.onnx (320, nchw) -> ssdlite_mobilenet_v2 (300, nhwc)
#   - hwaccel:   added preset-vaapi for hardware decode
#   - version:   0.17-0 -> 0.18-0
# Cameras, zones, objects, record and snapshot settings are UNCHANGED
# from New Paltz's tuned config.
#
# Benchmarked on brookside 2026-10-01: 5.62 ms mean GPU inference over
# 200 runs, against woodhull's 5.79 ms on identical hardware. The ZMQ
# detector and FrigateDetector.app are NOT needed on this host, and
# neither is the detector-monitor start-order watchdog that existed only
# to catch that process dying.
#
# ⚠️ Labelmap goes 80-class (coco-80) -> 91-class (coco_91cl_bkgr).
# Verified 2026-10-01: both tracked objects, `person` and `car`, exist in
# the 91-class map, so objects.track and objects.filters carry over
# unchanged. Re-check this if more object types are added.
#
# ⚠️ Disk: brookside is 225 G total, ~196 G free. woodhull runs 14-day
# alert retention on 4 cameras against 800 G free. One camera here at the
# same retention should land well inside the budget, but it is NOT the
# same headroom — measure actual growth before adding a second camera.
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# Frigate NVR Configuration — NEW PALTZ site
#
# THIS FILE IS NOT READ BY FRIGATE. Frigate reads /config/config.yml.
# On the NP host, before the first `docker compose up`:
#     cp frigate/config.np.yml frigate/config.yml
#
# config.yml stays the Brooklyn/woodhull config in git (so BK's live
# UI zone edits keep landing in git status the way 02cc071 did). This
# file is New Paltz's copy of it. When you retune NP zones in the
# Frigate UI on site, copy back:  cp frigate/config.yml frigate/config.np.yml
#
# Un-migrated from the woodhull shape 2026-09-08 (MOVE_READINESS §3.3).
# Deltas from config.yml: ZMQ/ANE detector instead of OpenVINO, no
# VAAPI hwaccel, NP cameras instead of Brooklyn's.
# ─────────────────────────────────────────────────────────────

# Authentication — default mode prompts you to create an admin
# account on first visit to http://192.168.2.70:8971
# DO NOT set "auth: none" — that locks you out of admin settings
auth:
  session_length: 2592000   # 30 days (default is 86400 = 1 day)

# ── Object Detection ─────────────────────────────────────────
# OpenVINO on the Intel iGPU, in-container. No host-side helper process,
# no Login Item, nothing to start in a particular order.
# Detector + model blocks are at the bottom of this file.

# ── Hardware decode — ENABLED on brookside ────────────────────
# `hwaccel_args: preset-vaapi` is set on the porch camera above. VAAPI is
# Intel/Linux and this host has /dev/dri/renderD128, so decode runs on the
# iGPU. The M1 could not do this — Docker Desktop on macOS cannot pass
# VideoToolbox into a container, so NP has been paying a software-decode
# CPU cost since the move. That cost goes away here.

# ── MQTT — connects Frigate → Home Assistant via Mosquitto ───
# The hostname "mosquitto" resolves on the Docker network
mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  # ── Site identity — set 2026-09-14, BEFORE the first NP camera is adopted ──
  # Changing topic_prefix AFTER entities exist forces HA to re-adopt every
  # camera entity under new unique IDs, losing history and every automation
  # reference; a default client_id of "frigate" means the second Frigate to
  # connect kicks the first off the broker in a reconnect loop. Free now,
  # ugly later — so it is set now, while NP has no adopted entities at all.
  topic_prefix: frigate_np
  client_id: frigate_np
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# ── Camera Configuration ──────────────────────────────────────
# One camera at New Paltz: `porch`. The disabled `front_door` template that
# kept this file bootable before any camera existed was removed 2026-09-28.
#
# Phase 5 (NP_IMPLEMENTATION_PLAN §5): mount 2-4 Reolink **PoE** cameras,
# reserve .33-.36 in DHCP on day one (MOVE_READINESS §3.5 — the 2026-08-03
# outage was exactly this gap), put the RTSP creds in a fresh NP
# secrets/frigate.env, then per camera: set enabled: true, fix the address,
# set detect width/height to the camera's ACTUAL sub-stream resolution, and
# draw zones in the UI zone editor rather than guessing coordinates here.
#
# Spec PoE, not Wi-Fi. BK's .33 E1 Pro is 2.4 GHz with no ethernet port and
# is a standing demonstration of the cost.
cameras:
  # ── Backyard wildlife camera (Reolink RLC-510WA) ─────────────
  # MOVED FROM BROOKLYN 2026-09-08. This is a real camera that travels with
  # the M1, not a template — the settings below are months of tuning and are
  # worth keeping. Only the address is a guess.
  #
  # ⚠️ It is 2.4 GHz WiFi with no PoE option, which is exactly what
  # MOVE_READINESS §3.5 says not to spec at NP. It is grandfathered, not
  # endorsed: give it a DHCP reservation on day one. Losing its .248
  # reservation when the Velop died on 2026-08-03 is what crash-looped
  # ffmpeg (858 ERRORs in ~20 min) and got it disabled on 08-05.
  #
  # Stock COCO only detects cat/dog/bird among animals. Raccoon/possum/
  # squirrel/deer need a Frigate+ trained model — collect snapshots, train,
  # then add labels to `track` below.
  porch:
    enabled: true    # Porch cam (ex-Brooklyn backyard RLC-510WA); enabled 2026-09-18
    ffmpeg:
      hwaccel_args: preset-vaapi   # Intel iGPU decode (added for brookside)
      input_args: preset-rtsp-restream
      retry_interval: 10
      inputs:
        # Sub-stream (Fluent 640x480) — detection AND recording.
        # 2026-06-15: dropped the 5MP main stream — WiFi at the mount could not
        # sustain it (record-stream Connection-timeouts + CSeq desync, ffmpeg
        # restarting ~1x/min). Re-add a main/record input only if it gets wired.
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.2.34:554/h264Preview_01_sub
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 3   # 5->3 on 2026-06-26 — frigate hit 93.5% of its 1536m cap
    # Motion-based recording so wildlife the base model cannot yet detect is
    # still captured — review the clips, grab a frame, upload to Frigate+.
    # Backyard ONLY (640x480, low bitrate). NOT global: motion-recording a
    # 5MP feed is what caused the 2026-04-08 disk crisis.
    record:
      motion:
        days: 2
    objects:
      # 2026-09-20: NP is a RURAL dead-end; the driveway is in frame. Brooklyn's
      # settings were built to SUPPRESS a busy street. Here the base rate of real
      # traffic is near zero, so a false positive is cheap and a miss is expensive.
      # A camera-level track list REPLACES the global one, it does not merge --
      # which is why `car` was absent from this camera and from the zone editor.
      track:
        - person
        - car
        - cat
        - dog
        - bird
        - bear
      filters:
        # Lowered min_score/threshold to catch low-res distant animals on the
        # 640x480 detect stream. More false positives is fine for a Frigate+
        # bootstrap; tune up once dog/cat detect reliably.
        dog:
          min_score: 0.3
          threshold: 0.5
        cat:
          min_score: 0.3
          threshold: 0.5
        bird:
          min_score: 0.4
          threshold: 0.55
        # person: looser than the global 1500/0.5/0.7. At 640x480 a person at the
        # end of the drive is ~900-1200 px, so 1500 was cutting off exactly the
        # early-warning case this camera exists for.
        person:
          min_area: 700
          min_score: 0.5
          threshold: 0.6
        # car: the global min_area of 12000 was raised from 8000 on 2026-04-08 to
        # hide distant parked cars on a Brooklyn street, and it is 3.9% of THIS
        # camera's 640x480 frame vs 2.6% of woodhull's 896x512 -- markedly stricter
        # on the camera where the drive is furthest away. 2500 is PROVISIONAL:
        # put a real car in the drive, read the area Frigate reports in the debug
        # view, then raise this to just under it. Do not guess a final number.
        # 2026-09-28: set to 300 on Paul's call. Cars park on the gray gravel
        # patch top-right (inside `yard`), far from the lens, and no car had
        # ever been tracked at 2500. Measurement mode: read real car areas from
        # events over the next week, then set just under the smallest.
        car:
          min_area: 300
          min_score: 0.6
          threshold: 0.7
        bear:
          min_area: 2000
          min_score: 0.5
          threshold: 0.6
    motion: {}
    # ⚠️ NEVER add a full-frame object mask (0,0,1,0,1,1,0,1). Tried via the UI
    # 2026-06-15 and removed the same day — object masks tell Frigate to IGNORE
    # objects in the masked area, so it suppressed every detection.
    #
    # Redraw the yard zone on site; the Brooklyn one is close to full-frame
    # and is kept only as a starting shape.
    zones:
      yard:
        coordinates: 
          0.499,0.493,0.101,0.514,0.093,0.163,0.477,0.167,1,0.307,1,0.934,0.66,0.635
        loitering_time: 0
        inertia: 3
      frontporch:
        coordinates: 
          0.016,0.065,0.086,0.147,0.45,0.155,0.458,0.31,0.832,0.561,0.823,0.835,1,1,0,1
        loitering_time: 0
        inertia: 3
        # No `car` here ON PURPOSE. required_zones is per-SEVERITY, not per-label,
        # so it cannot say "car alerts from the yard, person alerts from both".
        # Omitting car from this zone achieves exactly that: a car can never be
        # "in" frontporch, so with both zones required below, car alerts can only
        # ever originate in the yard while a person alerts from either.
        objects:
          - person
          - cat
          - dog
          - bird
          - bear
    review:
      alerts:
        # Only person and car PAGE. Animals still generate detections -- recorded
        # and reviewable in the UI -- but must never wake Paul at 3am for a cat.
        labels:
          - person
          - car
        # frontporch added 2026-09-20: a person already standing at the door was
        # producing a detection and no alert, which is backwards for an empty house.
        required_zones:
          - yard
          - frontporch

# ── Object tracking ───────────────────────────────────────────
# Carried over from BK unchanged. Revisit at NP: `car` was tuned for a
# Brooklyn street full of parked cars, which is not the NP problem.
objects:
  track:
    - person
    - car
  filters:
    person:
      min_area: 1500      # Ignore tiny/distant person shapes
      min_score: 0.5      # Minimum initial detection confidence
      threshold: 0.7      # Confirmed tracking threshold
    car:
      min_area: 12000
      min_score: 0.65
      threshold: 0.8

# ── Stationary Object Filtering ───────────────────────────────
# Stops Frigate from continuously re-alerting on objects that haven't moved.
#   threshold: 50 frames = ~10 seconds before marking as stationary
#   interval: 50 frames = re-check stationary objects every ~10 sec
#   max_frames.default: 3000 = ~10 min max tracking for all objects
#   Per-object keys (e.g. car: 150) are NOT supported in 0.17.x — still
#   waiting on 0.18+ (home-automation/TODO.md).
detect:
  stationary:
    threshold: 50
    interval: 50
    max_frames:
      default: 3000

# ── Recording ─────────────────────────────────────────────────
# Frigate 0.17: record.retain removed entirely — retention is now
# configured per event type (alerts/detections) only.
#
# These are BK's numbers, cut hard during the 2026-04-08 disk crisis on
# this same machine. Retune at NP once you know where recordings land:
# FRIGATE_MEDIA=./frigate/storage puts them on the M1's internal SSD
# (36 GB in use at BK). NP_IMPLEMENTATION_PLAN §5 Phase 5 assumed a
# dedicated 2 TB SSD, which was part of the M4 plan that MOVE_READINESS
# §3.1 dropped — so do not assume that headroom exists.
record:
  enabled: true
  alerts:
    pre_capture: 5
    post_capture: 2
    retain:
      days: 14
  detections:
    pre_capture: 5
    post_capture: 2
    retain:
      days: 2

# ── Snapshots ─────────────────────────────────────────────────
snapshots:
  enabled: true
  retain:
    default: 14
  quality: 85

# ── Motion Detection ──────────────────────────────────────────
motion:
  threshold: 30
  contour_area: 10

# ── Birdseye ──────────────────────────────────────────────────
birdseye:
  enabled: false

# ── TLS ───────────────────────────────────────────────────────
# Disabled — Frigate is published directly on host port 8971 (HTTP).
# LAN access: http://192.168.2.70:8971
# Tailscale access: https://media.tail317990.ts.net:8971 (via tailscale serve)
# Note NP uses the plain ports; the shifted 18xxx ports are woodhull's,
# forced by Avahi colliding with woodhull.local on 2026-09-03.
tls:
  enabled: false

version: 0.18-0

# ── Detector — OpenVINO on the Intel iGPU ─────────────────────
# Replaces the M1's ZMQ bridge (Frigate → :5555 → FrigateDetector.app →
# Apple Neural Engine), which has no Linux equivalent and was the single
# hardest part of this migration.
#
# Measured on brookside 2026-10-01: 5.62 ms mean over 200 inferences,
# against woodhull's 5.79 ms on identical silicon — same model, same
# image, same script. The M1's ANE path ran 15-25 ms.
#
# This also retires a whole class of failure. The ZMQ detector was an
# external process that could die independently, and on 2026-09-21 it did:
# detection was silently dead for three days while detector-monitor stayed
# green. OpenVINO runs in-container, so there is nothing to race and
# nothing to restart in order. Do NOT port detector-monitor's ORDER_*
# checks to this host.
detectors:
  ov:
    type: openvino
    device: GPU

# Model must match the detector. This is the OpenVINO model bundled inside
# the amd64 image at /openvino-model/ — nothing to download and no
# model_cache/yolo.onnx needed. Frigate has no auto-default for the
# openvino detector and crashes at startup if this block is absent.
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

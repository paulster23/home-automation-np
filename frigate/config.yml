# ─────────────────────────────────────────────────────────────
# Frigate NVR Configuration
# Camera: front_window @ 192.168.1.32 (Brooklyn street view)
# ─────────────────────────────────────────────────────────────

# Authentication — default mode prompts you to create an admin
# account on first visit to https://localhost:8971
# DO NOT set "auth: none" — that locks you out of admin settings

# ── Object Detection ─────────────────────────────────────────
# CPU detector — sufficient for 1 camera at 5fps on M1 Mac.
# CoreML (Apple Neural Engine) is NOT supported inside Docker on
# macOS — Docker runs in a VM and can't access the Neural Engine.
# To enable CoreML, you'd need to run apple-silicon-detector as
# a separate host process and connect via ZMQ. Left as a future
# project. See: https://github.com/frigate-nvr/apple-silicon-detector
detectors:
  cpu1:
    type: cpu
    num_threads: 3

# ── MQTT — connects Frigate → Home Assistant via Mosquitto ───
# The hostname "mosquitto" resolves on the Docker network
# Credentials match the password_file we set up in mosquitto/config/
mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# ── Camera Configuration ──────────────────────────────────────
cameras:
  front_window:
    ffmpeg:
      # RTSP resilience — auto-reconnect on camera drops, TCP for stability
      input_args: preset-rtsp-restream
      retry_interval: 10
      inputs:
        # Sub-stream (Fluent 896x512): used for object detection
        # Credentials loaded from environment variables (see docker-compose.yml secrets)
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.32:554/h264Preview_01_sub
          roles:
            - detect

        # Main stream (Clear 2880x1616): used for recording full quality
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.32:554/h264Preview_01_main
          roles:
            - record

    # Detection settings — matched to actual sub-stream ("Fluent") resolution
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 5

    # ── Zones ──────────────────────────────────────────────────
    # Three zones layered bottom-to-top on the Brooklyn street view.
    # Coordinates are approximate (896x512) — fine-tune in Frigate UI
    # zone editor after deployment.
    #
    # Frame layout (bottom to top):
    #   y=400-512: entrance (stoop, bikes, gate) — PEOPLE ONLY
    #   y=340-400: sidewalk — PEOPLE ONLY
    #   y=260-340: near-side parked cars — NO ZONE (ignored)
    #   y=180-260: active street/roadway — PEOPLE + CARS
    #   y=0-180:   far side (buildings, far parked cars) — NO ZONE (ignored)
    zones:
      entrance:
        coordinates: 0,400,896,400,896,512,0,512
        objects:
          - person
      sidewalk:
        coordinates: 250,340,896,340,896,400,250,400
        objects:
          - person
      active_street:
        coordinates: 0,180,896,180,896,260,0,260
        objects:
          - person
          - car

    # ── Review filtering ───────────────────────────────────────
    # Only generate alerts for people at entrance/sidewalk.
    # Detections include the active street (moving cars).
    # Objects outside these zones are tracked but don't create events.
    review:
      alerts:
        required_zones:
          - entrance
          - sidewalk
      detections:
        required_zones:
          - entrance
          - sidewalk
          - active_street

    # ── Motion mask ────────────────────────────────────────────
    # Masks the bottom-left where iron window bars + plants cause
    # constant false motion triggers from lighting changes.
    motion:
      mask:
        - 0,320,200,320,200,512,0,512

# ── Object Tracking ───────────────────────────────────────────
objects:
  track:
    - person
    - car
  filters:
    person:
      min_area: 1500      # Ignore tiny/distant person shapes
      min_score: 0.5      # Minimum initial detection confidence
      threshold: 0.7      # Confirmed tracking threshold
    car:
      min_area: 5000      # Only detect cars large enough to be close/relevant
                          # Filters out parked cars far in the background
      min_score: 0.5      # Minimum initial detection confidence
      threshold: 0.7      # Confirmed tracking threshold — reduces false positives

# ── Stationary Object Filtering ───────────────────────────────
# Stops Frigate from continuously re-alerting on objects that
# haven't moved. Key setting for a street cam with parked cars.
#
# How it works (at 5fps):
#   threshold: 50 frames = ~10 seconds before marking as stationary
#   interval: 50 frames = re-check stationary objects every ~10 sec
#   Once stationary, Frigate pauses detection on that object
#   and only resumes if it moves again.
#   max_frames.default: 3000 = ~10 min max tracking (Frigate 0.16
#   does not support per-object max_frames — use zones in Phase 4
#   to further limit car events by area)
detect:
  stationary:
    threshold: 50
    interval: 50          # Re-check every ~10 sec (must be > 0)
    max_frames:
      default: 3000       # ~10 min at 5fps before object is fully dropped

# ── Recording ─────────────────────────────────────────────────
# active_objects mode: only keeps recording segments that contain
# a moving tracked object (person or car). Replaces "all" which
# was recording every motion segment — the main cause of 20-30GB/day.
# Expected reduction: ~70-90% storage savings.
record:
  enabled: true
  retain:
    days: 1               # Keep 1 day of continuous recordings
    mode: active_objects  # CHANGED from "all" — only keep segments with moving objects
  alerts:
    pre_capture: 5        # Save 5 seconds before the alert
    post_capture: 5       # Save 5 seconds after the alert
    retain:
      days: 14            # Keep alert clips for 14 days
  detections:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 7             # Keep detection clips for 7 days (reduced from 14)

# ── Snapshots ─────────────────────────────────────────────────
snapshots:
  enabled: true
  retain:
    default: 14
  quality: 85

# ── Motion Detection ──────────────────────────────────────────
# Raised threshold slightly (25→30) to reduce spurious motion
# triggers from shadows, lighting changes, and distant movement.
motion:
  threshold: 30
  contour_area: 10

# ── Birdseye (disabled — single camera, not needed) ──────────
birdseye:
  enabled: false

version: 0.16-0

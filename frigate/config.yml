# ─────────────────────────────────────────────────────────────
# Frigate NVR Configuration
# Camera: front_window @ 192.168.1.33 (Brooklyn street view) — Reolink E1 Pro,
# 2.4 GHz Wi-Fi, no ethernet port. Sole camera since 2026-09-08.
# ─────────────────────────────────────────────────────────────

# Authentication — default mode prompts you to create an admin
# account on first visit to http://localhost:8971
# DO NOT set "auth: none" — that locks you out of admin settings
auth:
  session_length: 2592000   # 30 days (default is 86400 = 1 day)

# ── Object Detection ─────────────────────────────────────────
# Apple Silicon ZMQ detector (Frigate 0.17+).
# FrigateDetector.app runs on the macOS host, bridges Docker → Neural Engine
# via ZMQ on port 5555. Must be running before Frigate starts.
# Set as a Login Item so it starts on boot.
# See: https://github.com/frigate-nvr/apple-silicon-detector

# ── MQTT — connects Frigate → Home Assistant via Mosquitto ───
# The hostname "mosquitto" resolves on the Docker network
# Credentials match the password_file we set up in mosquitto/config/
mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# ── Hardware decode (added 2026-09-03 Phase 2 cutover) ────────
# Intel VAAPI on woodhull's iGPU — most of the CPU win alongside the OpenVINO
# detector swap below. Global so both cameras' ffmpeg processes use it.
ffmpeg:
  hwaccel_args: preset-vaapi

# ── Camera Configuration ──────────────────────────────────────
cameras:
  front_window:
    ffmpeg:
      # RTSP resilience — auto-reconnect on camera drops, TCP for stability
      # MODEL CORRECTED 2026-08-04: this camera is a **Reolink E1 Pro** (indoor pan/tilt,
      # 2.4-GHz Wi-Fi only, NO ethernet port), not an RLC-810A. The old note said RLC-810A,
      # which is a PoE camera — wrong hardware, and it sent the 2026-08-04 outage diagnosis
      # down a "just re-cable it" path that is physically impossible on this camera.
      # See plans/NETWORK_TOPOLOGY_CONTEXT.md §1. The CSeq behaviour described below was
      # observed on THIS camera and still stands; only the model name was wrong.
      # Note: this camera has a CSeq desync bug ("CSeq N expected, 0 received")
      # that causes ~80s restart cycles. Tried tcp→udp (no effect, CSeq is on control
      # channel) and -allowed_media_types video (broke segment muxer — reverted 2026-06-26).
      # Root fix: Reolink firmware update via Reolink app → Device → System → Firmware.
      input_args: preset-rtsp-restream
      retry_interval: 10
      inputs:
        # Sub-stream (Fluent 896x512): used for object detection
        # Credentials loaded from environment variables (see docker-compose.yml secrets)
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.33:554/h264Preview_01_sub
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - detect

        # Main stream (Clear 2880x1616): used for recording full quality
        # -timeout 5000000: socket-level read timeout (5s). Makes ffmpeg self-exit when the
        # camera stream stalls, so the watchdog can restart it immediately (~5s downtime)
        # rather than waiting 120s for the watchdog + 30s force-kill (~150s downtime).
        # Note: was -stimeout prior to 2026-05-28; renamed in newer ffmpeg builds.
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.33:554/h264Preview_01_main
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - record

    # Detection settings — matched to actual sub-stream ("Fluent") resolution
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 5

    # ── Zones ──────────────────────────────────────────────────
    # Three zones layered bottom-to-top on the Brooklyn street view.
    # Coordinates are approximate (896x512) — fine-tune in Frigate UI
    # zone editor after deployment.
    #
    # Frame layout (bottom to top):
    #   y=400-512: entrance (stoop, bikes, gate) — PEOPLE ONLY
    #   y=340-400: sidewalk — PEOPLE ONLY
    #   y=260-340: near-side parked cars — NO ZONE (ignored)
    #   y=180-260: active street/roadway — PEOPLE + CARS
    #   y=0-180:   far side (buildings, far parked cars) — NO ZONE (ignored)
    zones:
      entrance:
        coordinates: 
          0,0.197,0.088,0.214,0.255,0.262,0.263,0.43,0.984,0.756,1,1,0,1,0,0.382
        objects: person
        inertia: 3
        loitering_time: 0
      sidewalk:
        coordinates: 0,0.337,0.99,0.691,0.985,0.91,0,0.699
        objects: person
        inertia: 3
        loitering_time: 0
      active_street:
        coordinates: 0,0.097,1,0.315,1,0.712,0,0.323
        inertia: 3
        loitering_time: 0
      northside:
        coordinates: 0,0,1,0,0.99,0.344,0,0.19
        loitering_time: 0
        objects: person
        inertia: 3
    review:
      alerts:
        required_zones:
          - entrance
          - sidewalk
      detections:
        required_zones:
          - entrance
          - sidewalk
          - active_street
    motion: {}

  # ── Second camera: MOVED TO NEW PALTZ 2026-09-08 ─────────────
  # The RLC-510WA backyard cam (was 192.168.1.248, WiFi) goes with the M1.
  # Its config now lives in frigate/config.np.yml, not here. It had been
  # enabled: false since 2026-08-05 — it lost its .248 reservation when the
  # Velop died on 08-03 and crash-looped ffmpeg, so removing it changes
  # nothing about what Frigate is doing today.
  # Brooklyn is a one-camera site until a replacement is mounted.

objects:
  track:
    - person
    - car
  filters:
    person:
      min_area: 1500      # Ignore tiny/distant person shapes
      min_score: 0.5      # Minimum initial detection confidence
      threshold: 0.7      # Confirmed tracking threshold
    car:
      min_area: 12000     # Raised from 8000 — 2026-04-08: reduce distant/small car events
      min_score: 0.65     # Raised from 0.5 — higher initial confidence required
      threshold: 0.8      # Raised from 0.7 — stricter confirmed tracking threshold

# ── Stationary Object Filtering ───────────────────────────────
# Stops Frigate from continuously re-alerting on objects that
# haven't moved. Key setting for a street cam with parked cars.
#
# How it works (at 5fps):
#   threshold: 50 frames = ~10 seconds before marking as stationary
#   interval: 50 frames = re-check stationary objects every ~10 sec
#   Once stationary, Frigate pauses detection on that object
#   and only resumes if it moves again.
#   max_frames.default: 3000 = ~10 min max tracking for all objects
#   Note: per-object keys (e.g. car: 150) are NOT supported in 0.17.1.
detect:
  stationary:
    threshold: 50
    interval: 50          # Re-check every ~10 sec (must be > 0)
    max_frames:
      default: 3000       # ~10 min at 5fps — per-object keys not supported in 0.17.1

# ── Recording ─────────────────────────────────────────────────
# Frigate 0.17: record.retain removed entirely — retention is now
# configured per event type (alerts/detections) only.
record:
  enabled: true
  alerts:
    pre_capture: 5        # Save 5 seconds before the alert
    post_capture: 2       # Reduced from 5 — 2026-04-08 disk crisis
    retain:
      days: 14            # Keep alert clips for 14 days
  detections:
    pre_capture: 5
    post_capture: 2       # Reduced from 5 — 2026-04-08 disk crisis
    retain:
      days: 2             # Reduced from 7 — 2026-04-08 disk crisis (200GB spike)

# ── Snapshots ─────────────────────────────────────────────────
snapshots:
  enabled: true
  retain:
    default: 14
  quality: 85

# ── Motion Detection ──────────────────────────────────────────
# Raised threshold slightly (25→30) to reduce spurious motion
# triggers from shadows, lighting changes, and distant movement.
motion:
  threshold: 30
  contour_area: 10

# ── Birdseye (disabled — single camera, not needed) ──────────
birdseye:
  enabled: false

# ── TLS ───────────────────────────────────────────────────────
# Disabled — Frigate is published directly on host port 8971 (HTTP).
# LAN access: http://media.local:8971
# Tailscale access: https://media.tail317990.ts.net:8971 (via tailscale serve)
tls:
  enabled: false

version: 0.17-0

# Detector swapped 2026-09-03 (Phase 2 cutover, woodhull) — Apple Silicon ZMQ/ANE
# bridge doesn't exist on this host. OpenVINO on the iGPU per the §5.5 bake-off
# (PASS: 7.3-8.9ms inference, comfortably under the ANE bridge's own 15-25ms
# healthy range). Bundled SSDLite MobileNet v2 (91-class COCO) — dropping the
# model: block entirely crashes Frigate 0.17.2's OpenVINOModelRunner, must be
# pointed explicitly at the bundled files in /openvino-model/.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt


# ─────────────────────────────────────────────────────────────
# Frigate NVR Configuration — NEW PALTZ site
#
# THIS FILE IS NOT READ BY FRIGATE. Frigate reads /config/config.yml.
# On the NP host, before the first `docker compose up`:
#     cp frigate/config.np.yml frigate/config.yml
#
# config.yml stays the Brooklyn/woodhull config in git (so BK's live
# UI zone edits keep landing in git status the way 02cc071 did). This
# file is New Paltz's copy of it. When you retune NP zones in the
# Frigate UI on site, copy back:  cp frigate/config.yml frigate/config.np.yml
#
# Un-migrated from the woodhull shape 2026-09-08 (MOVE_READINESS §3.3).
# Deltas from config.yml: ZMQ/ANE detector instead of OpenVINO, no
# VAAPI hwaccel, NP cameras instead of Brooklyn's.
# ─────────────────────────────────────────────────────────────

# Authentication — default mode prompts you to create an admin
# account on first visit to http://192.168.2.70:8971
# DO NOT set "auth: none" — that locks you out of admin settings
auth:
  session_length: 2592000   # 30 days (default is 86400 = 1 day)

# ── Object Detection ─────────────────────────────────────────
# Apple Silicon ZMQ detector (Frigate 0.17+).
# FrigateDetector.app runs on the macOS host, bridges Docker → Neural Engine
# via ZMQ on port 5555. Must be running before Frigate starts.
# Set as a Login Item so it starts on boot.
# See: https://github.com/frigate-nvr/apple-silicon-detector
# Detector + model blocks are at the bottom of this file.

# ── No hwaccel ────────────────────────────────────────────────
# woodhull's `ffmpeg: hwaccel_args: preset-vaapi` is deliberately absent.
# VAAPI is Intel/Linux. Docker Desktop on macOS cannot pass VideoToolbox
# into a container, so decode is software here — this is the CPU cost the
# M1 paid before the migration and pays again. Budget for it: keep detect
# streams at sub-stream resolution and 5 fps, never decode a main stream
# for detection.

# ── MQTT — connects Frigate → Home Assistant via Mosquitto ───
# The hostname "mosquitto" resolves on the Docker network
mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  # ── Site identity — set 2026-09-14, BEFORE the first NP camera is adopted ──
  # Both sites' Frigates publish to their own mosquitto today, but they share
  # one Home Assistant MQTT namespace the moment the two are ever bridged, and
  # a default client_id of "frigate" means the second one to connect kicks the
  # first off the broker in a reconnect loop. Changing topic_prefix AFTER
  # entities exist forces HA to re-adopt every camera entity under new unique
  # IDs, losing history and every automation reference. Free to set now, ugly
  # to set later — so it is set now, while NP has no adopted entities at all.
  topic_prefix: frigate_np
  client_id: frigate_np
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# ── Camera Configuration ──────────────────────────────────────
# `backyard` below is a REAL camera arriving with the M1. `front_door` is a
# TEMPLATE — there are no other NP cameras yet (NP_SITE_REFERENCE.md:13:
# no cameras until the UniFi gear is in). This one camera exists so the
# file is valid YAML that Frigate will boot on; it is disabled so a
# nonexistent address cannot crash-loop ffmpeg the way backyard did on
# 2026-08-05.
#
# Phase 5 (NP_IMPLEMENTATION_PLAN §5): mount 2-4 Reolink **PoE** cameras,
# reserve .33-.36 in DHCP on day one (MOVE_READINESS §3.5 — the 2026-08-03
# outage was exactly this gap), put the RTSP creds in a fresh NP
# secrets/frigate.env, then per camera: set enabled: true, fix the address,
# set detect width/height to the camera's ACTUAL sub-stream resolution, and
# draw zones in the UI zone editor rather than guessing coordinates here.
#
# Spec PoE, not Wi-Fi. BK's .33 E1 Pro is 2.4 GHz with no ethernet port and
# is a standing demonstration of the cost.
cameras:
  front_door:
    enabled: false   # ⚠️ set true once the camera exists at a reserved address
    ffmpeg:
      input_args: preset-rtsp-restream
      retry_interval: 10
      inputs:
        # Sub-stream — object detection only. Keep this low-res.
        - path:
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.2.33:554/h264Preview_01_sub
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - detect

        # Main stream — full-quality recording.
        # -timeout 5000000: socket-level read timeout (5s). Makes ffmpeg self-exit
        # when the stream stalls so the watchdog restarts it in ~5s rather than
        # ~150s. (Was -stimeout before 2026-05-28; renamed in newer ffmpeg builds.)
        - path:
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.2.33:554/h264Preview_01_main
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - record

    # ⚠️ Placeholder resolution — MUST match the camera's real sub-stream.
    # A mismatch here does not error, it just degrades detection silently.
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 5

    # Zones: draw them in the Frigate UI on site, then copy config.yml
    # back over this file. Brooklyn's entrance/sidewalk/active_street/
    # northside geometry is meaningless at NP and is deliberately not
    # carried over.
    motion: {}

  # ── Backyard wildlife camera (Reolink RLC-510WA) ─────────────
  # MOVED FROM BROOKLYN 2026-09-08. This is a real camera that travels with
  # the M1, not a template — the settings below are months of tuning and are
  # worth keeping. Only the address is a guess.
  #
  # ⚠️ It is 2.4 GHz WiFi with no PoE option, which is exactly what
  # MOVE_READINESS §3.5 says not to spec at NP. It is grandfathered, not
  # endorsed: give it a DHCP reservation on day one. Losing its .248
  # reservation when the Velop died on 2026-08-03 is what crash-looped
  # ffmpeg (858 ERRORs in ~20 min) and got it disabled on 08-05.
  #
  # Stock COCO only detects cat/dog/bird among animals. Raccoon/possum/
  # squirrel/deer need a Frigate+ trained model — collect snapshots, train,
  # then add labels to `track` below.
  backyard:
    enabled: false   # ⚠️ set true once it is mounted at a reserved NP address
    ffmpeg:
      input_args: preset-rtsp-restream
      retry_interval: 10
      inputs:
        # Sub-stream (Fluent 640x480) — detection AND recording.
        # 2026-06-15: dropped the 5MP main stream — WiFi at the mount could not
        # sustain it (record-stream Connection-timeouts + CSeq desync, ffmpeg
        # restarting ~1x/min). Re-add a main/record input only if it gets wired.
        - path:
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.2.34:554/h264Preview_01_sub
          input_args: -rtsp_transport tcp -timeout 5000000
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 3   # 5->3 on 2026-06-26 — frigate hit 93.5% of its 1536m cap
    # Motion-based recording so wildlife the base model cannot yet detect is
    # still captured — review the clips, grab a frame, upload to Frigate+.
    # Backyard ONLY (640x480, low bitrate). NOT global: motion-recording a
    # 5MP feed is what caused the 2026-04-08 disk crisis.
    record:
      motion:
        days: 2
    objects:
      track:
        - person
        - cat
        - dog
        - bird
      filters:
        # Lowered min_score/threshold to catch low-res distant animals on the
        # 640x480 detect stream. More false positives is fine for a Frigate+
        # bootstrap; tune up once dog/cat detect reliably.
        dog:
          min_score: 0.3
          threshold: 0.5
        cat:
          min_score: 0.3
          threshold: 0.5
        bird:
          min_score: 0.4
          threshold: 0.55
    motion: {}
    # ⚠️ NEVER add a full-frame object mask (0,0,1,0,1,1,0,1). Tried via the UI
    # 2026-06-15 and removed the same day — object masks tell Frigate to IGNORE
    # objects in the masked area, so it suppressed every detection.
    #
    # Redraw the yard zone on site; the Brooklyn one is close to full-frame
    # and is kept only as a starting shape.
    zones:
      yard:
        coordinates: 0,0,1,0.03,0.982,0.98,0.021,0.98
        loitering_time: 0
    review:
      alerts:
        required_zones: yard

# ── Object tracking ───────────────────────────────────────────
# Carried over from BK unchanged. Revisit at NP: `car` was tuned for a
# Brooklyn street full of parked cars, which is not the NP problem.
objects:
  track:
    - person
    - car
  filters:
    person:
      min_area: 1500      # Ignore tiny/distant person shapes
      min_score: 0.5      # Minimum initial detection confidence
      threshold: 0.7      # Confirmed tracking threshold
    car:
      min_area: 12000
      min_score: 0.65
      threshold: 0.8

# ── Stationary Object Filtering ───────────────────────────────
# Stops Frigate from continuously re-alerting on objects that haven't moved.
#   threshold: 50 frames = ~10 seconds before marking as stationary
#   interval: 50 frames = re-check stationary objects every ~10 sec
#   max_frames.default: 3000 = ~10 min max tracking for all objects
#   Per-object keys (e.g. car: 150) are NOT supported in 0.17.x — still
#   waiting on 0.18+ (home-automation/TODO.md).
detect:
  stationary:
    threshold: 50
    interval: 50
    max_frames:
      default: 3000

# ── Recording ─────────────────────────────────────────────────
# Frigate 0.17: record.retain removed entirely — retention is now
# configured per event type (alerts/detections) only.
#
# These are BK's numbers, cut hard during the 2026-04-08 disk crisis on
# this same machine. Retune at NP once you know where recordings land:
# FRIGATE_MEDIA=./frigate/storage puts them on the M1's internal SSD
# (36 GB in use at BK). NP_IMPLEMENTATION_PLAN §5 Phase 5 assumed a
# dedicated 2 TB SSD, which was part of the M4 plan that MOVE_READINESS
# §3.1 dropped — so do not assume that headroom exists.
record:
  enabled: true
  alerts:
    pre_capture: 5
    post_capture: 2
    retain:
      days: 14
  detections:
    pre_capture: 5
    post_capture: 2
    retain:
      days: 2

# ── Snapshots ─────────────────────────────────────────────────
snapshots:
  enabled: true
  retain:
    default: 14
  quality: 85

# ── Motion Detection ──────────────────────────────────────────
motion:
  threshold: 30
  contour_area: 10

# ── Birdseye ──────────────────────────────────────────────────
birdseye:
  enabled: false

# ── TLS ───────────────────────────────────────────────────────
# Disabled — Frigate is published directly on host port 8971 (HTTP).
# LAN access: http://192.168.2.70:8971
# Tailscale access: https://media.tail317990.ts.net:8971 (via tailscale serve)
# Note NP uses the plain ports; the shifted 18xxx ports are woodhull's,
# forced by Avahi colliding with woodhull.local on 2026-09-03.
tls:
  enabled: false

version: 0.17-0

# ── Detector — RESTORED from the pre-cutover config (fe347dd^) ────────
# woodhull ran `type: openvino, device: GPU` against /dev/dri/renderD128.
# There is no /dev/dri on an M1. This is the Apple Neural Engine bridge:
# Frigate → ZMQ :5555 → FrigateDetector.app on the macOS host → ANE.
#
# Healthy inference_speed on this path was 15-25ms (vs woodhull's OpenVINO
# 7.3-8.9ms). Slower is expected and was accepted — MOVE_READINESS §3.3:
# "the two sites diverging on detector is fine and expected".
# If inference_speed reads 0 or the detector never appears, check that
# FrigateDetector.app is running BEFORE assuming a Frigate problem.
detectors:
  apple-silicon:
    type: zmq
    endpoint: tcp://host.docker.internal:5555

# Model must match the detector. yolo.onnx lives in frigate/model_cache/
# (gitignored, 9.2 MB, verified present on the Mac 2026-09-08). The
# OpenVINO block that replaced this pointed at /openvino-model/ inside the
# amd64 image and does not exist in the arm64 one.
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt
